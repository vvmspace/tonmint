[package]
name = "tonmint"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2.4"
eventsource-client = "0.12"
dotenv = "0.15"
lazy_static = "1.4"
base64 = "0.21"
hex = "0.4"
mongodb = "2.8"
bson = "2.8"
tonlib = "0.15"
async-trait = "0.1"
